const S={
I:{b:'s',c:'VKF',t:"Ölüm bitiş değildir; bazen sadece kapının değişmesidir. Cehennem’in en umutsuz köşesinde, herkese ikinci şans veren bir otel var. Seçimlerin Umut, Güven ve Karanlık’ı değiştirecek — ve sonu sen yazacaksın. Dokuz farklı son seni bekliyor.",o:[["Hikâyeyi başlat",0,0,0,0]]},
0:{b:'s',t:"Gözlerini açıyorsun. Gökyüzü kızıl, hava kül kokuyor. Ölmüşsün — ve Cehennem’in Küllük Sokağı’na düşmüşsün. Uzakta kırmızı neonla yazılmış bir tabela yanıp sönüyor: CEHENNEM OTEL — HERKESE İKİNCİ ŞANS. Arkandan ağır, ıslak ayak sesleri yaklaşıyor.",o:[["Tabelaya doğru var gücünle koş",1,1,0,0],["Arkanı dön ve ne olduğuna bak",2,0,0,1]]},
1:{b:'l',c:'V',t:"Otelin kapısından yüzüstü içeri yuvarlanıyorsun. Pembe neonlu lobide gülümseyen bir şeytan kız sana elini uzatıyor. “Ben Vesper, otelin sahibiyim! Yeni misafir mi? Harika!” Dışarıda çetenin yumrukları kapıya iniyor. “Ah, ve şu kapı çok uzun dayanmaz.”",o:[["“Beni sakla, lütfen. Sana güveniyorum.”",3,0,1,0],["“Kapıyı ben tutarım. Sen kaç.”",3,1,0,1]]},
2:{b:'s',c:'C',t:"Karşında kambur bir şeytan sırıtıyor: Çengel, Küllük çetesinin başı. Elindeki kanca ışıkta parlıyor. “Taze ruh! Cennet’in casuslarını arıyoruz. Şu otelin sığınağını bize göster, sana kimse dokunmaz. Hatta bize katılırsın.”",o:[["Anlaşmayı kabul et",'B1',0,0,3],["“Cehenneme git.” de ve otele doğru kaç",1,1,0,0]]},
3:{b:'l',c:'VK',t:"Vesper seni kanepenin arkasına çekiyor. Tek gözlü, kaslı muhafız Kül kapıyı kilitleyip barikat kuruyor; çete homurdanarak dağılıyor. Vesper hızlı hızlı anlatıyor: “Burada günahkârlar yeniden dönüşüyor! Amacım hepsini bir gün Cennet’e kabul ettirmek. Herkes bana deli diyor ama ben inanıyorum.” Gözleri umutla parlıyor.",o:[["“Bu çok güzel bir fikir. Yardım edeyim.”",4,2,1,0],["“Cehennem cehennemdir. Bu işe yaramaz.”",4,-1,0,1],["“Önce bir yatak. Sonra kurtuluş.”",4,0,1,0]]},
4:{b:'h',c:'K',t:"Gece, koridorda Kül seni durduruyor. Boş göz yuvasında mor bir taş titreşiyor. “Gözümü Cennet’in ilk saldırısında kaybettim. Bu taş onun yerine geçti. Gücüm ona bağlı. Onu benden ayıran herkes ölür.” Bunu bir tehdit gibi söylüyor… ama sesi garip biçimde yorgun.",o:[["“Çok acı çekmişsin.” Yanına otur",5,1,2,0],["“Tehdit etmeyi bırak. Kimse gözünü istemiyor.”",5,0,-1,0],["Hiçbir şey söyleme, geç git",5,0,0,0]]},
5:{b:'h',c:'F',t:"Sabah koridorda radyo parazitine benzeyen bir ses seni karşılıyor. Uzun boylu, ince, kocaman sırıtışlı biri: Fısıltı, otelin “yayıncısı”. “Yeni arkadaşım! Burada her şeyi bilirim. Sana bir sır satayım mı? Karşılığında küçük, çok küçük bir iyilik.” Sarı gözleri seni ölçüyor.",o:[["Sırrı dinle (iyilik borcu al)",6,0,-1,1],["“Kimseye borçlanmam.” Vesper’e git",7,0,1,0]]},
6:{b:'h',c:'F',t:"Fısıltı eğiliyor: “Cennet bu gece saldıracak. Meleklerin ‘arınma’ planı var. Otel kurtulabilir — ama Kül’ün taşını bana getirirsen. Onsuz Kül zayıf; onunla ben herkesi korurum. Söz.” Sırıtışı biraz fazla geniş.",o:[["Gece Kül’ün odasına gir ve taşı al",8,0,-2,3],["“Bu kokuyor.” Vesper’e hepsini anlat",7,1,1,0]]},
7:{b:'l',c:'VP',t:"Öğleden sonra ilk dönüşüm seansı. Misafirler sandalyelerle halka kurmuş. Eski bir banker, açgözlü Bay Pas, altın kesesini sıkıyor. Vesper şarkı söylercesine açıyor: “Her biri bir günahını itiraf etsin! Önce sen — yeni misafir!” Bütün gözler üstünde.",o:[["Gerçek günahını açıkça itiraf et",'M',2,2,0],["Yalan söyle, yırt",'M',0,-1,1],["Bay Pas’ın yanına otur, ona destek ol",'M',1,1,0]]},
M:{b:'l',c:'VKP',t:"Seans biter bitmez bağırışlar yükseliyor: Bay Pas’ın altın kesesi kayıp! Misafirler birbirini suçluyor, Kül yumruklarını sıkıyor, Vesper araya girmeye çalışıyor. Odadaki herkes sana bakıyor — yeni geldin, üstelik ilk seansta ilginç davrandın.",o:[["Herkesi tek tek sorguya çek",9,0,-1,1],["“Sakin olun. Birlikte arayalım.”",9,1,2,0],["Kesenin Bay Pas’ın şapkasında olduğunu fark et ve şaka yap",9,1,1,0]]},
8:{b:'h',c:'KF',t:"Gece, Kül’ün odası. Taş komodinde mor bir ateş gibi titriyor. Parmakların ona değer değmez Kül’ün tek gözü açılıyor. Karanlıkta sessizce, tehlikeli biçimde: “Sana güvenmiştim.” Kapıda Fısıltı’nın gölgesi beliriyor, eli uzanmış.",o:[["Taşı Fısıltı’ya fırlat, kaç",'B2',0,-3,3],["Taşı bırak ve gerçeği anlat",9,1,2,-1]]},
9:{b:'r',c:'V',t:"Akşam. Çatıda Vesper yalnız oturuyor, kızıl gökyüzüne bakıyor. “Bazen kimsenin gelmeyeceğinden korkuyorum,” diyor sessizce. “Ya bu otel sadece benim hayalimse? Ya hepsi boşunaysa?” Aşağıdan misafirlerin kahkahası duyuluyor.",o:[["“Hayal değil. Ben buradayım.”",10,2,2,0],["“Belki hayaldir. Gerçekçi ol.”",10,-2,-1,1],["Şakayla konuyu değiştir",10,0,1,0]]},
10:{b:'k',c:'S',t:"Gece yarısı gökyüzü yarılıyor. Beyaz ışık sütunları Cehennem’e iniyor. Kanatlı komutan Sera otelin tepesinde süzülüyor. “Arınma saati geldi. Bu binadaki her ruh silinecek. Ama içinizden biri bana kapıyı açarsa, diğerleri affedilir.” Yer sarsılıyor; misafirler çığlık atıyor.",o:[["Dışarı çık, meleğe meydan oku",11,1,0,1],["Misafirleri servis merdivenine yönlendir",12,1,2,0],["Meleğin teklifini bir kez dinle",13,-1,-2,2]]},
11:{b:'k',c:'SVK',t:"Sokağa çıkıyorsun. Sera kanatlarını açıyor; mızrağının ucundan altın ışık damlıyor. “Bir günahkâr benimle konuşmak mı istiyor?” Arkanda Vesper ile Kül dizilmiş. Vesper’in elleri titriyor ama çenesi dik.",o:[["“Bu insanlar değişiyor. Gel, kendin gör.”",14,2,1,0],["Önce sen saldır: mızrağını kap",14,0,-1,2],["Diz çök, yalvar",14,-1,0,0]]},
12:{b:'h',c:'KP',t:"Kül servis kapısını omzuyla tutuyor; sen misafirleri tek tek merdivenden aşağı sürüyorsun. Bay Pas bir yandan ağlıyor, bir yandan altın kasasına sarılıyor: “Bunu bırakmam!” Tavan çatırdıyor.",o:[["Kasayı elinden çek: “Hayatın daha değerli.”",14,1,1,0],["Kasayı onunla taşı, vakit kaybet",14,-1,0,1]]},
13:{b:'k',c:'SV',t:"Sera yüzünü sana yaklaştırıyor, sesi ipek gibi: “Vesper’i bana ver. Otelin kalbi o. Karşılığında seni Cennet’e alırız, bu gece. Düşün: bir daha hiç acı yok.” Aşağıda Vesper adını fısıldıyor: “…sen mi?”",o:[["Vesper’i teslim et",'B3',-2,-3,3],["“Hayır.” Teklifi reddet",14,2,1,-1]]},
14:{b:'k',c:'FVS',t:"Çatışmanın ortasında Fısıltı beliriyor; gülüşü radyo parazitiyle karışıyor. “Bu savaşı bir şarkıda bitirebilirim. Bedeli: otelin ruhu. Yani Vesper’in hayali. Fena değil, değil mi?” Vesper bir adım geri atıyor. Herkes sana bakıyor.",o:[["“Hayır. Güç karşılığında ruh satmayız.”",15,1,1,-1],["Teklifi kabul et",15,-1,-1,3],["Kararı Vesper’e bırak",15,1,2,0]]},
15:{b:'r',c:'VK',t:"Işık sönüyor. Gökyüzü yeniden kızıl; otel yarı yıkık. Duvarlar duman tütüyor ama içeride hâlâ sesler var: misafirler, Kül, Vesper. Herkes sana dönüyor. Vesper bitkin gülümsüyor: “Peki… şimdi ne yapacağız?”",o:[["Hep birlikte yeniden inşa edelim",'end',2,2,0],["Cennet’e mektup yaz: dönüşümü kanıtla",'end',2,0,0],["Yönetimi üstlen, kurallar senin olsun",'end',0,-1,2]]},
B1:{b:'e',n:"İhanetin Bedeli",q:"Kötü son",t:"Çeteyi otelin sığınağına götürüyorsun. Vesper’in şarkısı tek bir çığlığa dönüşüyor. Çengel omzuna vuruyor: “İyi köpek.” Ama Cehennem’de kimse sadık köpeklere teşekkür etmez; ertesi sabah zincirlerle uyanıyorsun. Otel yok. Umut yok. Sadece sen ve sonsuz Küllük."},
B2:{b:'e',n:"Fısıltı’nın Piyonu",q:"Kötü son",t:"Taşı Fısıltı’ya fırlatıyorsun. Mor ışık patlıyor; Kül yere yığılıyor. Fısıltı taşı avucunda sıkarken kahkahası koridorları dolduruyor: “Otel artık yayında!” Sabah herkes sırıtıyor — ve sırıtmayı bırakamıyor. Sen de dahil."},
B3:{b:'e',n:"Soğuk Cennet",q:"Kötü son",t:"Vesper’i meleğe teslim ediyorsun. Işık seni yutuyor. Cennet’te beyaz, sessiz bir koridorda uyanıyorsun. Kimse konuşmuyor, kimse gülmüyor. Çok aşağıda kızıl bir neon bir an yanıp sönüyor ve sönüyor. Kurtuldun… ama neye karşılık?"},
D:{b:'e',n:"Karanlığın Efendisi",q:"Kötü son",t:"Otel yeniden ayakta ama farklı. Neon artık pembe değil, kan kırmızı. Kuralları sen koyuyorsun; misafirler gülüyor çünkü gülmek zorunda. Vesper çatıda sessiz, Kül başını eğmiş. Güçlüsün. Sevilmiyorsun. Cehennem seni kendi çocuğu sayıyor."},
A:{b:'e',n:"Küllerin Sabahı",q:"Kötü son",t:"Umutsuz bir sabah. Misafirler tek tek çantalarını topluyor. Vesper kapıyı kapatırken tabelayı usulca söküyor. Duman yükseliyor. Otel susuyor; Cehennem, geri kalan her şey gibi, aynı kalıyor."},
Y:{b:'e',n:"Yalnız Kapı",q:"Kötü son",t:"Kimse sana güvenmiyor. Savaştan sağ çıktın ama herkes odasına çekilmiş. Yemek masasında senin sandalyen boş. Otel yaşıyor; sen ise eşikte, içeri girmeyi bekliyorsun. Kimse seni çağırmıyor."},
Z:{b:'r',c:'VKP',n:"Herkese İkinci Şans",q:"İyi son",t:"Güneş yok ama sabah gibi bir şey doğuyor. Misafirler duvarlara yeni boyalar sürüyor; Kül omzuna vuruyor, Bay Pas altınını otele bağışlıyor. Vesper sana ilk anahtarı veriyor: “Artık sen de buranın evisin.” Neon yeniden yanıyor, bu sefer bütün Cehennem görsün diye. Cennet’ten bir mektup geliyor: “İncelemeye alındı.” Bu kadarı bile bir mucize."},
G:{b:'r',c:'VK',n:"Kırık Ama Yaşayan Otel",q:"İyi son",t:"Otel çatırdıyor, tavan bir yerde hâlâ açık. Ama kapı yine açık, misafirler yine içeride. Vesper yeni bir plan çiziyor, Kül çekiç sallıyor. Hayat zor; ama burada her sabah biri kendine ikinci şans veriyor. Bu yeter."},
N:{b:'r',c:'V',n:"Gri Şafak",q:"Belirsiz son",t:"Otel ayakta. Herkes hayatta. Ama kimse gerçekten kimseye güvenmiyor. Vesper gülümsüyor, gözleri uzakta. İyi mi kötü mü, kimse bilmiyor. Şafak geliyor, Cehennem’de olduğu kadar."}};
